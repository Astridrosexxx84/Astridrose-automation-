name: Validate automation code

"on":
  push:
    paths:
      - "*.py"
      - ".github/workflows/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q Bot.py RedditBot.py RedditDraft.py metrics_report.py cross_platform_drafts.py
      - name: Test Bluesky dry run
        env:
          BLUESKY_HANDLE: test.example
          BLUESKY_APP_PASSWORD: test-only-not-a-real-password
          BLUESKY_POST_TEXT: hello
          BLUESKY_DRY_RUN: "true"
        run: |
          output=$(python Bot.py)
          echo "$output"
          test "$output" = "DRY RUN: would publish: hello"
      - name: Test draft generation and report
        run: |
          python RedditDraft.py
          test -s reddit-draft.md
          grep -qi "nothing has been posted to Reddit" reddit-draft.md
          python metrics_report.py
          test -s metrics-report.md
          python cross_platform_drafts.py
          test -s cross-platform-draft-pack.md
          grep -q "LinkedIn" cross-platform-draft-pack.md
          grep -q "YouTube Shorts" cross-platform-draft-pack.md
      - name: Confirm Reddit publishing is opt-in
        run: python -c "from pathlib import Path; s=Path('RedditBot.py').read_text(); assert 'os.environ.get(\"REDDIT_PUBLISH\", \"false\")' in s"
