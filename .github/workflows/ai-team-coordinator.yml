name: Astrid Rose — AI team (manual, review-only)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Question or task for the AI team (no secrets or sensitive data)"
        required: true
        type: string
        default: "We are building Astrid Rose into a profitable social-media content business. Our first and primary goal is to create engaging content, publish consistently, grow an audience, and eventually earn revenue. Do not recommend unrelated business opportunities at this stage. Constraints: $0 upfront spending; our only hardware is our existing Android phone until the business earns enough to justify additional hardware. Use free tools and services where practical. We can use as many free apps/tools as useful, provided they work practically on mobile. Existing setup includes CapCut, Canva, Metricool, YouTube and Instagram accounts with publishing tested, plus a working GitHub Actions AI team using Gemini, Groq, and OpenRouter. Some platform connections and automation still need work. Automate repetitive tasks wherever practical but keep human review over content and publishing. We are still developing the production workflow and must prioritise execution over endless planning. Team task: (1) recommend the best practical phone-only content production and publishing workflow using free tools; (2) identify the next three concrete milestones in priority order; (3) propose a realistic 14-day experiment to test content formats and audience response; (4) define measurable success metrics and how to track them for free; (5) distinguish tasks that can be automated now, tasks requiring manual work, and automation to build later; (6) explain how to move toward monetisation. Reinvestment rule: once revenue exists, evaluate hardware, software, AI tools, subscriptions, advertising, production, services, outsourcing, and any other opportunity on expected return, cost, risk, time saved, quality, growth and payback period. Do not assume one category is best; invest only where evidence shows the strongest benefit, using small measurable experiments and preserving operating cash. Have every configured provider contribute independently where possible; use only a runtime-verified zero-price OpenRouter model for final synthesis, otherwise preserve partial work in a deterministic report. Missing provider keys must not block other configured providers. Be specific to our setup. Do not assume a large audience. Do not recommend paid subscriptions or spending before revenue, and do not publish content or change social accounts. Produce a complete report with clear next actions."
        
permissions:
  contents: read

jobs:
  ai-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the AI team (analysis only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOW_GEMINI_FREE_TIER_CALLS: ${{ vars.ALLOW_GEMINI_FREE_TIER_CALLS }}
          ALLOW_GROQ_FREE_TIER_CALLS: ${{ vars.ALLOW_GROQ_FREE_TIER_CALLS }}
          AI_TEAM_TASK: ${{ inputs.task }}
        run: python ai_team_coordinator.py
      - name: Save report for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astrid-rose-ai-team-report
          path: |
            ai-team-report.md
            ai-battery-status.md
            ai-battery-status.json
          if-no-files-found: error
          retention-days: 14
