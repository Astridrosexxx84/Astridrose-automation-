name: Brain App — Fast Checks

on:
  push:
    branches: [main]
    paths:
      - "brain-app/**"
      - ".github/workflows/brain-app-checks.yml"
  pull_request:
    paths:
      - "brain-app/**"
      - ".github/workflows/brain-app-checks.yml"

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript and Python syntax
        run: |
          node --check brain-app/app.js
          python -m py_compile brain_relay_worker.py brain_relay_chain.py brain_cloudflare_worker.py
      - name: Check app wiring and database contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          app = Path("brain-app/app.js").read_text(encoding="utf-8")
          html = Path("brain-app/index.html").read_text(encoding="utf-8")
          schema = Path("brain-app/supabase/migrations/0001_brain_app_core.sql").read_text(encoding="utf-8")
          deletion_migration = Path("brain-app/supabase/migrations/0006_task_deletion_tombstones.sql").read_text(encoding="utf-8").lower()
          packet_migration = Path("brain-app/supabase/migrations/0003_add_packet_fields.sql").read_text(encoding="utf-8").lower()
          hardening_migration = Path("brain-app/supabase/migrations/0004_harden_updated_at_search_path.sql").read_text(encoding="utf-8").lower()
          service_worker = Path("brain-app/service-worker.js").read_text(encoding="utf-8")
          html_script = re.search(r'<script src="(app\.js\?[^"]+)"', html)
          cached_script = re.search(r'"(\./app\.js\?[^"]+)"', service_worker)
          if not html_script or not cached_script or "./" + html_script.group(1) != cached_script.group(1):
              raise SystemExit("index.html app.js URL must match the service-worker precache URL")
          if "brain-app-shell-v13" not in service_worker or "app.js?v=core-recovery-1" not in html:
              raise SystemExit("Core recovery release must bump the service-worker cache and app script URL")
          html_ids = set(re.findall(r"""\bid=["']([^"']+)["']""", html))
          app_ids = set(re.findall(r"""\$\(["']([^"']+)["']\)""", app))
          missing = sorted(app_ids - html_ids)
          if missing:
              raise SystemExit("App references missing HTML IDs: " + ", ".join(missing))
          for table in ("brain_projects", "brain_tasks", "brain_worker_runs", "brain_task_events"):
              if f"public.{table}" not in schema:
                  raise SystemExit(f"Core table missing from migration: {table}")
          if "enable row level security" not in schema.lower():
              raise SystemExit("Core migration does not enable row-level security")
          for column in ("current_worker", "next_worker", "current_output", "next_action"):
              if f"add column if not exists {column}" not in packet_migration:
                  raise SystemExit(f"Packet-field migration is missing idempotent column {column}")
          if "set search_path = ''" not in hardening_migration or "pg_catalog.now()" not in hardening_migration:
              raise SystemExit("updated_at trigger migration must harden search_path and qualify now()")
          if "add column if not exists deleted_at timestamptz" not in deletion_migration:
              raise SystemExit("Task deletion must use a durable deleted_at tombstone")
          if "if (prior?.deletedat && !item.deletedat) continue;" not in app.lower():
              raise SystemExit("A stale local task must not overwrite a remote deletion tombstone")
          if 'update({deleted_at: now()})' not in app:
              raise SystemExit("Task deletion must preserve a cloud tombstone rather than hard-delete the row")
          if "state.tasks = state.tasks.filter(t => !t.deletedat);" not in app.lower():
              raise SystemExit("Deleted tasks must be excluded from the merged local workspace")
          sync_body = app.split("async function syncLocalToCloud()", 1)[1].split("async function applyPrivateRelayResults()", 1)[0]
          if 'cloudClient.from("brain_tasks").select("*").order("updated_at", {ascending:false})' not in sync_body:
              raise SystemExit("Cloud sync must fetch current remote tasks before upserting local state")
          if "state.tasks = mergeByFreshness(state.tasks, (remoteTasksResult.data || []).map(fromRemoteTask))" not in sync_body:
              raise SystemExit("Cloud sync must merge remote freshness before writes")
          if "if (remoteTasksResult.error) throw remoteTasksResult.error;" not in sync_body:
              raise SystemExit("Cloud sync must stop safely when the remote preflight read fails")
          active_run_migration = Path("brain-app/supabase/migrations/0005_one_active_run_per_task.sql").read_text(encoding="utf-8")
          if "create unique index if not exists brain_worker_runs_one_active_per_task_idx" not in active_run_migration:
              raise SystemExit("Database contract must prevent concurrent active runs for one task")
          if "where status in ('queued', 'running')" not in active_run_migration:
              raise SystemExit("Active-run uniqueness must cover queued and running attempts only")
          dispatcher = Path("brain-app/supabase/functions/dispatch-brain-relay/index.ts").read_text(encoding="utf-8")
          for guard in ('"stale_queued_run_reconciled"', '"stale_running_run_reconciled"', 'in("status", ["queued", "running"])', 'runError?.code === "23505"', '}, 409)'):
              if guard not in dispatcher:
                  raise SystemExit("Dispatcher must reconcile stale runs and reject concurrent attempts: " + guard)
          if 'const recoveringMissingOutput = ["handed_off", "working", "complete"].includes(task.status) && !String(task.output || "").trim();' not in app:
              raise SystemExit("Private relay recovery must backfill empty output for eligible in-flight, review, and completed tasks")
          recovery = app.split("async function applyPrivateRelayResults()", 1)[1].split("async function loadVerificationEvents()", 1)[0]
          if "const recoverableTaskIds = recoverableTasks.map(task => task.id);" not in recovery:
              raise SystemExit("Private relay recovery must scope result lookup to tasks needing recovery")
          if '.in("task_id", recoverableTaskIds)' not in recovery:
              raise SystemExit("Private relay recovery must query all results for the affected task IDs")
          if ".limit(30)" in recovery:
              raise SystemExit("Private relay recovery must not silently drop results beyond a global latest-30 limit")
          if 'task.status = run.status === "succeeded" ? "handed_off" : "blocked";' not in app:
              raise SystemExit("Recovered successful private relay results must remain in review until verified")
          if 'Verify the returned output against the goal and acceptance criteria before marking complete.' not in app:
              raise SystemExit("Recovered successful results must request acceptance-criteria verification")
          for ui_id in ("taskSearch", "taskStatusFilter", "taskCount"):
              if f'id="{ui_id}"' not in html:
                  raise SystemExit(f"Task filter UI is missing {ui_id}")
          if 'const visibleTasks = tasks.filter(t => {' not in app or 'haystack.includes(taskQuery)' not in app:
              raise SystemExit("Task search must filter by task content")
          if 't.status !== statusFilter' not in app:
              raise SystemExit("Task status filter must be applied")
          if "No tasks match. Try another search or status." not in app:
              raise SystemExit("Task search must show a helpful empty state")
          if "if (!recoveringMissingOutput && Date.parse(run.finished_at || 0) < Date.parse(task.updatedAt || 0)) continue;" not in app:
              raise SystemExit("Empty-output recovery must not be blocked by a newer task sync timestamp")
          for required in ("async function loadVerificationEvents()", "async function recordVerification(passed)", "verification_passed", "verification_failed", "await cloudClient.from(\"brain_task_events\").insert({", "await loadVerificationEvents();", "renderVerification();"):
              if required not in app:
                  raise SystemExit(f"Task verification flow is missing: {required}")
          for ui_id in ("verificationNotes", "verificationEvidence", "verifyPassBtn", "verifyFailBtn", "nextActionProposal", "proposeNextActionBtn"):
              if f'id="{ui_id}"' not in html:
                  raise SystemExit(f"Task verification UI is missing {ui_id}")
          for guard in ('if (!String(task.goal || "").trim())', 'if (!String(task.output || "").trim())', 'if (!notes)'):
              if guard not in app:
                  raise SystemExit("Verification must require goal, output, and review notes")
          if 'task.status = passed ? "complete" : "handed_off";' not in app:
              raise SystemExit("Only passed owner verification may mark a task complete")
          if "Saved result says SUCCESS — last updated " not in app:
              raise SystemExit("Simple result must show saved-success timestamp")
          if 'task.output = "";' not in app or "New test started. Waiting for a fresh answer…" not in app:
              raise SystemExit("Starting a safe test must clear stale output and wait for a fresh answer")
          if "It is historical evidence, not proof that a new test ran just now." not in app:
              raise SystemExit("Simple result must distinguish historical success from a fresh test")
          if "function proposeNextAction()" not in app or "PROPOSED NEXT ACTION — NOT EXECUTED" not in app or "PROPOSED CORRECTIVE ACTION — NOT EXECUTED" not in app:
              raise SystemExit("Next-action proposal must be grounded in verification and remain non-executing")
          for status in ("queued", "running", "review", "blocked", "completed"):
              if status not in schema:
                  raise SystemExit(f"Expected task status missing from database schema: {status}")
          print(f"Smoke checks passed: JavaScript syntax; {len(app_ids)} referenced UI IDs; four core tables; RLS declaration.")
          PY
