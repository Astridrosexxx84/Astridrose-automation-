name: Run Bluesky bot

on:
  workflow_dispatch:
  schedule:
    # Every Tuesday at 10:00 AM New Zealand time during NZ daylight saving.
    # GitHub cron uses UTC; local time shifts by an hour when NZ changes clocks.
    - cron: "0 21 * * 1"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python Bot.py
