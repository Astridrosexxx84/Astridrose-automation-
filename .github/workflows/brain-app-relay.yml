name: Brain App — One-Click Sequential Relay

on:
  workflow_dispatch:
    inputs:
      task:
        description: "PUBLIC REPO: use non-sensitive task text only; do not include secrets or private data"
        required: true
        type: string
        default: "Build the first working version of the Brain App multi-AI handoff system. Produce a clear first-turn plan and identify the next concrete implementation step."
      provider:
        description: "Choose auto to run the free-provider chain in one go"
        required: true
        type: choice
        options:
          - auto
          - openrouter
          - gemini
          - groq
          - cloudflare
        default: auto
      role:
        description: "What this worker should do"
        required: true
        type: choice
        options:
          - create
          - continue
          - review
        default: continue
      prior_packet:
        description: "PUBLIC REPO: prior packet may be exposed; paste only non-sensitive content"
        required: false
        type: string
        default: ""
      next_worker:
        description: "Informational next-worker hint"
        required: false
        type: string
        default: openrouter
      task_id:
        description: "Brain App task ID used to match the result to its task"
        required: false
        type: string
        default: ""
      project_id:
        description: "Brain App project ID used to match the result to its project"
        required: false
        type: string
        default: ""
      private_run_id:
        description: "Opaque ID for retrieving a private task packet from Supabase"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "brain-app/relay-request.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: brain-app-sequential-relay
  cancel-in-progress: false

jobs:
  relay-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Claim private relay request
        if: inputs.private_run_id != ''
        env:
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          BRIDGE_URL: https://cjqgdqcbtcwsgbbqrqcf.supabase.co/functions/v1/brain-relay-bridge
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, uuid
          run_id = os.environ["PRIVATE_RUN_ID"]
          if not run_id:
              raise SystemExit("Private run ID is required.")
          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not request_url or not request_token:
              raise SystemExit("GitHub OIDC is unavailable; refusing public fallback.")
          separator = "&" if "?" in request_url else "?"
          token_url = request_url + separator + urllib.parse.urlencode({"audience": "brain-app-relay"})
          req = urllib.request.Request(token_url, headers={"Authorization": "Bearer " + request_token})
          with urllib.request.urlopen(req, timeout=20) as response:
              oidc = json.load(response)["value"]
          body = json.dumps({"operation": "claim", "run_id": run_id}).encode()
          req = urllib.request.Request(os.environ["BRIDGE_URL"], data=body, method="POST",
              headers={"Authorization": "Bearer " + oidc, "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              claimed = json.load(response)
          payload = claimed.get("payload")
          if not isinstance(payload, dict) or not str(payload.get("task", "")).strip():
              raise SystemExit("Private bridge returned an invalid task packet.")
          allowed = ("task", "provider", "role", "prior_packet", "next_worker", "task_id", "project_id")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in allowed:
                  value = str(payload.get(key, ""))
                  delimiter = "BRAINAPP_" + uuid.uuid4().hex
                  env.write(f"AI_RELAY_{key.upper()}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Private relay request claimed; content was not printed or added to workflow inputs.")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare relay request
        if: inputs.private_run_id == ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_ROLE: ${{ inputs.role }}
          INPUT_PRIOR_PACKET: ${{ inputs.prior_packet }}
          INPUT_NEXT_WORKER: ${{ inputs.next_worker }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
        run: |
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "push":
              request = json.loads(Path("brain-app/relay-request.json").read_text(encoding="utf-8"))
          else:
              request = {
                  "task": os.environ.get("INPUT_TASK", ""),
                  "provider": os.environ.get("INPUT_PROVIDER", "auto"),
                  "role": os.environ.get("INPUT_ROLE", "continue"),
                  "prior_packet": os.environ.get("INPUT_PRIOR_PACKET", ""),
                  "next_worker": os.environ.get("INPUT_NEXT_WORKER", "openrouter"),
                  "task_id": os.environ.get("INPUT_TASK_ID", ""),
                  "project_id": os.environ.get("INPUT_PROJECT_ID", ""),
              }
          request.setdefault("provider", "auto")
          request.setdefault("role", "continue")
          request.setdefault("prior_packet", "")
          request.setdefault("next_worker", "review the complete relay packet")
          request.setdefault("task_id", "")
          request.setdefault("project_id", "")
          if not str(request.get("task", "")).strip():
              raise SystemExit("Relay request must include a non-empty task.")
          if request["provider"] not in ("auto", "openrouter", "gemini", "groq", "cloudflare"):
              raise SystemExit("Provider must be auto, openrouter, gemini, or groq.")
          if request["role"] not in ("create", "continue", "review"):
              raise SystemExit("Role must be create, continue, or review.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in ("task", "provider", "role", "prior_packet", "next_worker", "task_id", "project_id"):
                  value = str(request[key])
                  delimiter = "BRAINAPP_" + uuid.uuid4().hex
                  env.write(f"AI_RELAY_{key.upper()}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Relay request validated; task content is not printed.")
          PY
      - name: Run sequential provider chain
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOW_GEMINI_FREE_TIER_CALLS: "true"
          ALLOW_GROQ_FREE_TIER_CALLS: "true"
        run: python brain_relay_chain.py
      - name: Store private relay result
        if: always() && inputs.private_run_id != ''
        env:
          PRIVATE_RUN_ID: ${{ inputs.private_run_id }}
          BRIDGE_URL: https://cjqgdqcbtcwsgbbqrqcf.supabase.co/functions/v1/brain-relay-bridge
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not request_url or not request_token:
              raise SystemExit("GitHub OIDC is unavailable; private result was not published.")
          separator = "&" if "?" in request_url else "?"
          token_url = request_url + separator + urllib.parse.urlencode({"audience": "brain-app-relay"})
          req = urllib.request.Request(token_url, headers={"Authorization": "Bearer " + request_token})
          with urllib.request.urlopen(req, timeout=20) as response:
              oidc = json.load(response)["value"]
          try:
              result = json.loads(Path("brain-relay-packet.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              result = {"schema_version": 1, "overall_outcome": "error", "turns": [], "next_action": "Inspect the GitHub workflow failure and retry."}
          body = json.dumps({"operation": "complete", "run_id": os.environ["PRIVATE_RUN_ID"], "result": result}).encode()
          req = urllib.request.Request(os.environ["BRIDGE_URL"], data=body, method="POST",
              headers={"Authorization": "Bearer " + oidc, "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              stored = json.load(response)
          if not stored.get("ok"):
              raise SystemExit("Private relay result was not accepted by the bridge.")
          print("Relay result stored in private Supabase; task text and responses were not uploaded as an artifact.")
          PY
      - name: Upload portable handoff packet
        if: always() && inputs.private_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: brain-app-relay-packet
          path: |
            brain-relay-packet.md
            brain-relay-packet.json
            brain-relay-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish safe relay status for the dashboard
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          ledger = {}
          packet = {}
          for name, target in (("brain-relay-status.json", "ledger"), ("brain-relay-packet.json", "packet")):
              try:
                  data = json.loads(Path(name).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  data = {}
              if target == "ledger":
                  ledger = data
              else:
                  packet = data
          turns = []
          for item in packet.get("turns", []):
              turns.append({
                  "provider": str(item.get("provider", "unknown"))[:40],
                  "model": str(item.get("model", ""))[:100],
                  "outcome": "success" if item.get("outcome") == "success" else "error",
                  "error_category": str(item.get("error_category") or "")[:100],
              })
          status = {
              "schema_version": 1,
              "updated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
              "outcome": str(packet.get("overall_outcome") or ledger.get("outcome") or "error"),
              "successful_turns": int(packet.get("successful_turns", ledger.get("successful_turns", 0)) or 0),
              "total_turns": int(packet.get("total_turns", ledger.get("total_turns", 0)) or 0),
              "turns": turns,
              "note": "Metadata only. Prompts, task text, model responses and API keys are not published here."
          }
          path = Path("brain-app/relay-status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          print("Publishing relay status metadata only; no task or response content.")
          PY
      - name: Commit safe relay status through GitHub API
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "brain-app/relay-status.json";
            const content = fs.readFileSync(path, "utf8");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: "main" });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: "Update Brain App relay status metadata",
              content: Buffer.from(content, "utf8").toString("base64"),
              branch: "main",
              ...(sha ? { sha } : {}),
              committer: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com"
              }
            });
            core.info("Published relay status metadata only; task prompts and responses were excluded.");
