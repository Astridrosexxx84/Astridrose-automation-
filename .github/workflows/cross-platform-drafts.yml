name: Build cross-platform draft pack
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"
permissions:
  contents: read
jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate drafts for major platforms
        run: python cross_platform_drafts.py
      - uses: actions/upload-artifact@v4
        with:
          name: cross-platform-draft-pack
          path: cross-platform-draft-pack.md
          retention-days: 30
