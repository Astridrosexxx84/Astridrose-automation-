name: Astrid Rose — content toolkit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cross-platform draft pack
        run: python cross_platform_drafts.py
      - name: Generate metrics report
        run: python metrics_report.py
      - name: Upload review-only outputs
        uses: actions/upload-artifact@v4
        with:
          name: astrid-rose-toolkit
          path: |
            cross-platform-draft-pack.md
            metrics-report.md
          if-no-files-found: error
          retention-days: 30
