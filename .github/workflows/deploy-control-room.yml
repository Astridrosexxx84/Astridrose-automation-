name: Deploy AI Control Room and Brain App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control-room/**"
      - "brain-app/**"
      - ".github/workflows/deploy-control-room.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site/brain-app
          cp -a control-room/. site/
          cp -a brain-app/. site/brain-app/
          test -f site/index.html
          test -f site/brain-app/index.html
          echo "Pages site contains the control room at / and Brain App at /brain-app/."
      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
