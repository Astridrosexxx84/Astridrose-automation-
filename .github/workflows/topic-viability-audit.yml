name: Topic viability audit — research and free media

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/topic-viability-audit.yml"
      - "topic_viability_audit.py"
      - "topic_shortlist_audit.py"
      - "free_trend_selector.py"
      - "build_storyboard.py"
      - "build_rights_review_queue.py"
      - "build_footage_review_queue.py"
      - "build_footage_edit_plan.py"
      - "youtube_breakout_discovery.py"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional single topic to audit; leave blank to compare a shortlist of free trends"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile topic_viability_audit.py topic_shortlist_audit.py free_trend_selector.py build_storyboard.py build_rights_review_queue.py build_footage_review_queue.py build_footage_edit_plan.py youtube_breakout_discovery.py

      - name: Detect candidates from free Google Trends RSS when no topic was entered
        if: ${{ inputs.topic == '' }}
        run: python free_trend_selector.py

      - name: Compare top trend shortlist against research and media leads
        if: ${{ inputs.topic == '' }}
        run: python topic_shortlist_audit.py

      - name: Scout YouTube videos for the discovered trend shortlist using the free public feed
        if: ${{ inputs.topic == '' }}
        run: python youtube_breakout_discovery.py

      - name: Audit manually entered topic
        if: ${{ inputs.topic != '' }}
        env:
          AUDIT_TOPIC: ${{ inputs.topic }}
        run: python topic_viability_audit.py

      - name: Build preliminary storyboard drafts from audit evidence
        run: python build_storyboard.py

      - name: Build item-level rights review queue
        run: python build_rights_review_queue.py

      - name: Build conservative video footage review queue
        run: python build_footage_review_queue.py

      - name: Create unapproved edit-plan template from licence leads
        run: python build_footage_edit_plan.py

      - name: Save decision reports, media inventories, storyboard drafts and rights queue
        uses: actions/upload-artifact@v4
        with:
          name: topic-viability-audit
          path: |
            topic-audit/
            storyboard-drafts/
            footage-edit-plan.json
          if-no-files-found: error
          retention-days: 14
