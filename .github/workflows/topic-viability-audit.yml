name: Topic viability audit — research and free media

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional single topic to audit; leave blank to compare a shortlist of free trends"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile topic_viability_audit.py topic_shortlist_audit.py free_trend_selector.py

      - name: Detect candidates from free Google Trends RSS when no topic was entered
        if: ${{ inputs.topic == '' }}
        run: python free_trend_selector.py

      - name: Compare top trend shortlist against research and media leads
        if: ${{ inputs.topic == '' }}
        run: python topic_shortlist_audit.py

      - name: Audit manually entered topic
        if: ${{ inputs.topic != '' }}
        env:
          AUDIT_TOPIC: ${{ inputs.topic }}
        run: python topic_viability_audit.py

      - name: Save decision reports and media inventories
        uses: actions/upload-artifact@v4
        with:
          name: topic-viability-audit
          path: topic-audit/
          if-no-files-found: error
          retention-days: 14
