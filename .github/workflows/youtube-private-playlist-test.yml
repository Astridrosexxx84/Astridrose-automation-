name: Private YouTube playlist proof of concept
on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Topic for private test playlist"
        required: true
        default: "popular music 2026"
        type: string
      playlist_title:
        description: "Private playlist title"
        required: true
        default: "Automation Test - Private Playlist"
        type: string
      max_results:
        description: "Videos to add (1-5)"
        required: true
        default: "5"
        type: string
permissions:
  contents: read
jobs:
  create-private-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create private playlist
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          PLAYLIST_TITLE: ${{ inputs.playlist_title }}
          MAX_RESULTS: ${{ inputs.max_results }}
        run: python youtube_private_playlist_test.py
      - name: Upload result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-playlist-test-result
          path: playlist-test-result.txt
          if-no-files-found: ignore
          retention-days: 7
