name: General YouTube topic discovery

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "Comma-separated topics to compare in one run"
        required: true
        default: "popular music 2026, gaming highlights 2026, viral food videos 2026, entertainment trending 2026, sports highlights 2026, technology videos 2026"
        type: string
      max_results:
        description: "Number of results (1–25)"
        required: true
        default: "10"
        type: string
      lookback_days:
        description: "Prefer videos published within the last N days (1–365)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search YouTube (discovery only; no posts or playlist changes)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SEARCH_QUERIES: ${{ inputs.search_query || 'popular music 2026, gaming highlights 2026, viral food videos 2026, entertainment trending 2026, sports highlights 2026, technology videos 2026' }}
          MAX_RESULTS: ${{ inputs.max_results || '10' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
        run: python youtube_keyword_search.py

      - name: Save search results for review
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-candidates
          path: youtube-search-results.txt
          if-no-files-found: error
          retention-days: 7
