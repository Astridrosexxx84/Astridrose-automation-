name: 90s Cartoon Nostalgia — weekly YouTube discovery

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      search_query:
        description: "Keywords to search on YouTube"
        required: true
        default: "1990s cartoons official clips nostalgia retrospectives"
        type: string
      max_results:
        description: "Number of results (1–25)"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search YouTube (discovery only; no posts or playlist changes)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SEARCH_QUERY: ${{ inputs.search_query || '1990s cartoons official clips nostalgia retrospectives' }}
          MAX_RESULTS: ${{ inputs.max_results || '10' }}
        run: python youtube_keyword_search.py

      - name: Save search results for review
        uses: actions/upload-artifact@v4
        with:
          name: 90s-cartoon-candidates
          path: youtube-search-results.txt
          if-no-files-found: error
          retention-days: 7
