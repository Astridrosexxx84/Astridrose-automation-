name: Temporary AI team validation

on:
  push:
    paths:
      - ".github/workflows/ai-team-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AI team coordinator (validation only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_TEAM_TASK: "Validation test: propose one practical $0-upfront experiment. Analysis only; do not publish or modify accounts."
        run: python ai_team_coordinator.py
      - name: Save validation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: astrid-rose-ai-team-validation-report
          path: ai-team-report.md
          if-no-files-found: error
          retention-days: 3
