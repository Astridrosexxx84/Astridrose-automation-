name: Fast scoring tests

on:
  push:
    branches:
      - main
    paths:
      - "topic_shortlist_audit.py"
      - "topic_viability_audit.py"
      - "tests/**"
      - ".github/workflows/topic-scoring-tests.yml"
  pull_request:
    paths:
      - "topic_shortlist_audit.py"
      - "topic_viability_audit.py"
      - "tests/**"
      - ".github/workflows/topic-scoring-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile topic_viability_audit.py topic_shortlist_audit.py tests/test_scoring_smoke.py
      - name: Run scoring regression tests without network calls
        run: python -m unittest discover -s tests -v
