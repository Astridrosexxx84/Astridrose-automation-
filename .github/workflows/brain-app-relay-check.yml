name: Brain App relay checks

on:
  push:
    branches: [main]
    paths:
      - "brain_relay_worker.py"
      - "brain_relay_chain.py"
      - "tests/test_brain_relay*.py"
      - ".github/workflows/brain-app-relay.yml"
      - "brain-app/**"
      - ".github/workflows/brain-app-relay-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile relay Python files
        run: python -m py_compile brain_relay_worker.py brain_relay_chain.py
      - name: Run offline relay handoff tests
        run: python -m unittest discover -s tests -p 'test_brain_relay*.py' -v
      - name: Validate app manifest
        run: python -m json.tool brain-app/manifest.webmanifest >/dev/null
      - name: Check service worker cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path("brain-app/service-worker.js").read_text(encoding="utf-8")
          cache_line = next((line for line in worker.splitlines() if line.startswith("const CACHE = ")), "")
          try:
              version = int(cache_line.split("-v", 1)[1].split('"', 1)[0])
          except (IndexError, ValueError):
              version = 0
          if version < 3:
              raise SystemExit("Service worker cache must be bumped so installed phones receive current app code.")
          if not any(item in worker for item in ('"./app.js"', '"./app.js?v=')) or '"./index.html"' not in worker:
              raise SystemExit("Service worker must cache the app shell.")
          print("Service worker cache version and app shell checks passed.")
          PY
      - name: Check dashboard JavaScript syntax
        run: node --check brain-app/app.js
      - name: Check relay run link ID validation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("brain-app/app.js").read_text(encoding="utf-8")
          if r"/^\d+$/.test(runId)" not in app:
              raise SystemExit("Relay run link must accept numeric GitHub Actions run IDs.")
          if r"/^\\d+$/.test(runId)" in app:
              raise SystemExit("Relay run link contains an over-escaped digit pattern.")
          handler = app.split('$("projectList").addEventListener("click"', 1)[1].split('$("taskList").addEventListener("click"', 1)[0]
          if "savePacket(false)" not in handler:
              raise SystemExit("Switching projects must save the current task editor first.")
          if handler.index("savePacket(false)") > handler.index("selectedProjectId ="):
              raise SystemExit("Project switch must save edits before changing the selected project.")
          if "function syncPacketFromForm(trimValues=false)" not in app:
              raise SystemExit("Task packet must have a shared form-to-state sync function.")
          if 'const read = id => trimValues ? $(id).value.trim() : $(id).value;' not in app:
              raise SystemExit("Autosave must preserve trailing spaces while the user is typing.")
          if "if (!syncPacketFromForm(true)) return false;" not in app:
              raise SystemExit("Explicit save must normalize task fields after editing.")
          if '$("packetForm").addEventListener("input"' not in app:
              raise SystemExit("Task packet fields must autosave while being edited.")
          autosave = app.split('$("packetForm").addEventListener("input"', 1)[1].split('$("newProjectBtn").addEventListener("click"', 1)[0]
          if "persist()" not in autosave or "render()" in autosave:
              raise SystemExit("Autosave must persist edits without re-rendering the form.")
          if "setInterval(() =>" not in app or "if (!document.hidden) refreshRelayStatus();" not in app or "}, 60000);" not in app:
              raise SystemExit("Relay status must refresh automatically while the dashboard is visible.")
          if "task_id: t.id" not in app or "project_id: t.projectId" not in app:
              raise SystemExit("Generated relay requests must include their originating task and project IDs.")
          if "if (incoming.task_id)" not in app or "task ID that is not in this browser workspace" not in app:
              raise SystemExit("Relay import must match the originating task and refuse unknown IDs.")
          chain = Path("brain_relay_chain.py").read_text(encoding="utf-8")
          if '"task_id": task_id' not in chain or '"project_id": project_id' not in chain:
              raise SystemExit("Relay result packets must preserve task and project IDs.")
          relay_workflow = Path(".github/workflows/brain-app-relay.yml").read_text(encoding="utf-8")
          if '"task_id", "project_id"' not in relay_workflow:
              raise SystemExit("Workflow must pass task identity into the relay runner.")
          print("Relay run links, project switching, autosave, and status-refresh checks passed.")
          PY
      - name: Validate public relay status privacy schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("brain-app/relay-status.json")
          if not path.exists():
              print("No relay status published yet; schema check skipped.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          required = {"schema_version", "updated_at", "run_id", "run_url", "outcome", "successful_turns", "total_turns", "turns"}
          missing = required - set(data)
          if missing:
              raise SystemExit("Relay status missing fields: " + ", ".join(sorted(missing)))
          forbidden = {"task", "prior_packet", "worker_output", "prompt", "response", "api_key"}
          if forbidden & set(data):
              raise SystemExit("Public relay status contains private-content fields.")
          for turn in data["turns"]:
              if set(turn) - {"provider", "model", "outcome", "error_category"}:
                  raise SystemExit("Public relay status contains unexpected provider fields.")
          print("Relay status schema and privacy checks passed.")
          PY
      - name: Check required relay safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path("brain_relay_worker.py").read_text(encoding="utf-8")
          chain = Path("brain_relay_chain.py").read_text(encoding="utf-8")
          required_worker = [
              "No paid fallback",
              "You have no filesystem",
              'provider.upper()',
              '_FREE_TIER_CALLS',
              "No currently listed zero-price OpenRouter model",
          ]
          missing = [item for item in required_worker if item not in worker]
          if missing:
              raise SystemExit("Missing worker safeguards: " + ", ".join(missing))
          for item in ("successful_turns", "overall_outcome", "Worker exited without producing its own readable packet"):
              if item not in chain:
                  raise SystemExit("Missing chain reliability feature: " + item)
          workflow = Path(".github/workflows/brain-app-relay.yml").read_text(encoding="utf-8")
          if '"brain-app/relay-request.json"' not in workflow:
              raise SystemExit("Missing file-triggered relay request path.")
          if "PUBLIC REPO" not in workflow:
              raise SystemExit("Workflow inputs must warn that task text may be public.")
          readme = Path("brain-app/README.md").read_text(encoding="utf-8")
          dashboard = Path("brain-app/index.html").read_text(encoding="utf-8")
          if "workflow artifacts" not in readme.lower() or "potentially accessible" not in readme.lower():
              raise SystemExit("README must explain that relay artifacts may be accessible to repository readers.")
          if "relay artifacts contain task text and AI responses" not in dashboard:
              raise SystemExit("Dashboard must show the relay artifact privacy warning.")
          print("Relay safeguard and public-artifact privacy checks passed.")
          PY
