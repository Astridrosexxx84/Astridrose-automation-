name: Publish one free original YouTube Short
on:
  push:
    branches:
      - main
    paths:
      - "publish_free_short.py"
      - ".github/workflows/publish-free-original-short.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip pillow
      - name: Set the reviewed topic for this one original Short
        id: topic
        shell: bash
        run: |
          echo "topic=Zelda remake" >> "$GITHUB_OUTPUT"
          echo "Selected topic: Zelda remake"
      - name: Render and upload an original public Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCOVERY_TOPIC: Zelda remake
        run: python publish_free_short.py
      - name: Show publication result
        if: always()
        shell: bash
        run: |
          {
            echo "## Free original Short"
            echo
            echo "Selected topic: ${{ steps.topic.outputs.topic }}"
            echo
            if [ -f published-video-result.txt ]; then
              cat published-video-result.txt
            else
              echo "No successful upload result. Check the preceding job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-original-short-result
          path: |
            published-video-result.txt
            topic-discovery-scorecard.txt
            output/free-original-short.mp4
          if-no-files-found: ignore
          retention-days: 30
